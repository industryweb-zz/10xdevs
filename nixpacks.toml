# Pins the PHP/Node versions Nixpacks auto-detects, so a Nixpacks release
# doesn't silently drift from composer.json's "php": "^8.3" constraint.
# Nixpacks' PHP provider auto-configures nginx + php-fpm serving public/ as
# docroot for a detected Laravel app - do not override [start] here; verify
# the generated start command in the first `railway logs` build output
# instead of assuming it matches this file.
providers = ["php", "node"]

[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "nodejs_20"]

[phases.build]
cmds = [
    "npm ci",
    "npm run build",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache"
]
